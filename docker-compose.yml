services:
  awg-panel:
    build: .
    container_name: awg-panel
    restart: unless-stopped
    environment:
      AWG_CONTAINER: amnezia-awg2
      AWG_INTERFACE: awg0
      PANEL_USER: ${PANEL_USER:-admin}
      PANEL_PASSWORD: ${PANEL_PASSWORD:?set PANEL_PASSWORD in .env}
      ONLINE_SECONDS: ${ONLINE_SECONDS:-180}
      VPN_ENDPOINT: ${VPN_ENDPOINT:?set VPN_ENDPOINT in .env}
      VPN_NETWORK: ${VPN_NETWORK:-10.8.1.0/24}
      VPN_DNS: ${VPN_DNS:-1.1.1.1}
      CLIENT_ALLOWED_IPS: ${CLIENT_ALLOWED_IPS:-0.0.0.0/0, ::/0}
      CLIENT_MTU: ${CLIENT_MTU:-1420}
      CLIENT_KEEPALIVE: ${CLIENT_KEEPALIVE:-25}
      TLS_CERT: /cert/fullchain.pem
      TLS_KEY: /cert/privkey.pem
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./data:/data
      - ${CERT_DIR:-./cert}:/cert:ro
    ports:
      - "127.0.0.1:${PANEL_PORT:-8443}:8080"
    read_only: true
    tmpfs:
      - /tmp:mode=1777,noexec,nosuid,size=32m
    pids_limit: 64
    mem_limit: 256m
    security_opt:
      - no-new-privileges:true

  caddy:
    image: caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    container_name: awg-panel-caddy
    restart: unless-stopped
    depends_on:
      - awg-panel
    environment:
      PANEL_DOMAIN: ${PANEL_DOMAIN:?set PANEL_DOMAIN in .env}
      PANEL_AUTH_HASH: ${PANEL_AUTH_HASH:?set PANEL_AUTH_HASH in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    security_opt:
      - no-new-privileges:true

volumes:
  caddy_data:
  caddy_config:
